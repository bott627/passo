name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The same database the app expects locally, started just for this run.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fares
          POSTGRES_PASSWORD: passo2026
          POSTGRES_DB: passo_fares
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://fares:passo2026@localhost:5432/passo_fares

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Create the tables
        run: npx prisma db push

      - name: Add the sample fares
        run: npm run seed

      - run: npm test
